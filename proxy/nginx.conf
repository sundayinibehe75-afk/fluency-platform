worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Redirect all HTTP traffic to HTTPS
    server {
        listen 80;
        server_name _;

        return 301 https://$host$request_uri;
    }

    # HTTPS — SSL termination and reverse proxy
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Look up container addresses through Docker's DNS on every request
        # (cached 10s), so recreating the api/frontend containers during a
        # deploy never leaves the proxy pointing at an old address (502).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream      api:8000;
        set $frontend_upstream frontend:80;

        # Route /api/* to the FastAPI backend (the path is passed unchanged)
        location /api/ {
            proxy_pass         http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            # Overwrite (not append) so a client cannot fake its IP; the API
            # uses this for per-visitor rate limiting.
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Route everything else to the React frontend
        location / {
            proxy_pass         http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
