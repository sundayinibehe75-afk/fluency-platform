name: CI/CD

# Runs on every push to main, or manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/sundayinibehe75-afk/fluency-api
  FRONTEND_IMAGE: ghcr.io/sundayinibehe75-afk/fluency-frontend

jobs:
  # ---------- 1. TEST ----------
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fluency-tutoring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build

  # ---------- 2. BUILD, SCAN AND PUSH ----------
  build-and-push:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # lets GITHUB_TOKEN push to GHCR
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3

      # Build each image locally first, scan it, and only push if the scan passes.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest

      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.API_IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true      # only fail on problems that have a fix
          exit-code: "1"            # a finding stops the pipeline

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./fluency-tutoring
          load: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push images (only reached if both scans passed)
        run: |
          docker push --all-tags ${{ env.API_IMAGE }}
          docker push --all-tags ${{ env.FRONTEND_IMAGE }}

  # ---------- 3. APPROVAL + 4. DEPLOY ----------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # The "production" environment has a required reviewer, so this job
    # waits for you to click "Approve" before it runs.
    environment: production
    permissions:
      packages: read           # lets the VM pull the images with this job's token
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull new images and restart on the VM
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin && \
             cd ~/fluency-platform && git pull origin main && \
             export IMAGE_TAG=${{ github.sha }} && \
             docker compose -f docker-compose.yml -f docker-compose.prod.yml pull api frontend && \
             docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build"

      - name: Health check
        run: |
          sleep 15
          curl -fsS "http://${{ secrets.DEPLOY_HOST }}/" > /dev/null && echo "Site is up"
